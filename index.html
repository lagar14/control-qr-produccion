<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Producción QR</title>
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: #fff; margin: 0; padding: 10px; }
        h1 { font-size: 1.3rem; margin: 15px 0; }
        #reader { width: 100%; max-width: 480px; margin: 0 auto; border-radius: 12px; overflow: hidden; border: 2px solid #007bff; }
        #result { margin-top: 15px; font-size: 1.1rem; font-weight: bold; color: #4CAF50; word-break: break-all; padding: 0 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Escáner de Producción</h1>
        <div id="reader"></div>
        <div id="result">Apunta al código QR...</div>
    </div>

    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <script src="app.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js');
        }
    </script>
</body>
</html>
